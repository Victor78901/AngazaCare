{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 540px; margin: 2rem auto;">
    <h2>{{ t.get('forgot_password', 'Forgot Password?') }}</h2>
    <p>{{ t.get('forgot_password_description', 'Enter your account email. If it matches an account, reset instructions will be generated.') }}</p>
    <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <div class="form-field">
            <label for="email">{{ t.get('email', 'Email') }}</label>
            <input type="email" name="email" id="email" autocomplete="email" maxlength="120" required />
        </div>
        <button class="btn" type="submit">{{ t.get('request_reset_link', 'Request Reset Link') }}</button>
    </form>
    <p style="margin-top: 1rem;"><a href="{{ url_for('login') }}">{{ t.get('back_to_login', 'Back to login') }}</a></p>
</div>
{% endblock %}
